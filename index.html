<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom_Manipulation</title>
    <script src="script.js" defer></script>
</head>
<style> 
 *{
    margin: 0;
    padding: 0;
    font-family: Gilroy;
    box-sizing: border-box;
 }
 html,
 body {
    width: 100%;
    height: 100%;
 }

 #main{
   padding: 20px;
    height: 100%;
    width: 100%;
    background-color: #222;
 }

 .card{
    max-width:300px;
    margin-top:40px;
    border-radius: 10px;
    display: inline-block;
    padding:20px;
    border:1px solid #555;
 }

 .profile{
    text-color
    width:40px;
    height:40px;
    background-color: red;
    border-radius: 50%;
    margin-bottom: 7px;
    overflow:hidden;
 }

 .profile img{
    width: 40px;
    height: 40px;
    object-fit: cover;
 }
 .card h5{
    margin-top:3px;
 }

 .card p{
    font-size:12px;
    margin-top: 20px;
 }

 input {
    display:block;
 }


</style>
<body>
<div id="main">
<form>
    
    <input type="text" placeholder="Profile Pic">
    <input type="text" placeholder="name">
    <input type="text" placeholder="Occupation">
    <input type="text" placeholder="Info">
    <input type ="submit">
</form>


</div>


</body>
</html>
