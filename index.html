<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom_Manipulation</title>

<style> 
 *{
    margin: 0;
    padding: 0;
    font-family: Gilroy;
    box-sizing: border-box;
 }
 html,
 body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
 }
 #abcd{
    position: absolute;
    transition: all cubic-bezier(0.25, 0.1, 0.25, 1) 0.3s;
    width: 40px;
    height: 40px;
    background-color: red;
}

 
</style>
   
</head>
<body>
<form>
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <input type="submit">
</form>

<script src="script.js"></script>




</body>
</html>
