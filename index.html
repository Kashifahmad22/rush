
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopify - Online Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">

        <!-- Logo -->
        <h2 class="logo">SHOPIFY.</h2>

        <!-- Navigation links -->
        <ul class="nav-links" id="navLinks">
            <li><a href="#">Home</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#">Categories</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <!-- Search bar -->
        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >
            <button id="searchBtn">Search</button>
        </div>

        <!-- Cart -->
        <div class="cart">
            🛒 Cart (<span id="cartCount">0</span>)
        </div>

        <!-- Hamburger menu -->
        <button class="menu-btn" id="menuBtn">
            ☰
        </button>

    </nav>


    <!-- HERO SECTION -->
    <section class="hero">

        <h1>Discover Your Style.</h1>

        <p>Find the best products at amazing prices.</p>

        <a href="#products" class="shop-btn">
            Shop Now
        </a>

    </section>


    <!-- PRODUCTS SECTION -->
    <section class="products-section" id="products">

        <h2>Our Products</h2>

        <div class="product-container" id="productContainer">

            <!-- Product 1 -->
            <div class="product-card" data-name="Sneakers">

                <img
                    src="https://placehold.co/300x200?text=Sneakers"
                    alt="Sneakers"
                >

                <h3>Sneakers</h3>

                <p>₹1,999</p>

                <button class="add-cart">
                    Add to Cart
                </button>

            </div>


            <!-- Product 2 -->
            <div class="product-card" data-name="Watch">

                <img
                    src="https://placehold.co/300x200?text=Watch"
                    alt="Watch"
                >

                <h3>Watch</h3>

                <p>₹2,499</p>

                <button class="add-cart">
                    Add to Cart
                </button>

            </div>


            <!-- Product 3 -->
            <div class="product-card" data-name="Headphones">

                <img
                    src="https://placehold.co/300x200?text=Headphones"
                    alt="Headphones"
                >

                <h3>Headphones</h3>

                <p>₹999</p>

                <button class="add-cart">
                    Add to Cart
                </button>

            </div>


            <!-- Product 4 -->
            <div class="product-card" data-name="Backpack">

                <img
                    src="https://placehold.co/300x200?text=Backpack"
                    alt="Backpack"
                >

                <h3>Backpack</h3>

                <p>₹1,499</p>

                <button class="add-cart">
                    Add to Cart
                </button>

            </div>

        </div>

        <p id="noResults" class="no-results">
            No products found.
        </p>

    </section>


    <!-- FOOTER -->
    <footer>
        <p>© 2026 SHOPIFY. All rights reserved.</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
