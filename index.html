<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom_Manipulation</title>
</head>
<style> 
 *{
    margin: 0;
    padding: 0;
    font-family: Gilroy;
    box-sizing: border-box;
 }
 html,
 body {
    width: 100%;
    height: 100%;
 }

 #main{
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    width: 100%;
    background-color: #222;
 }
 input{
    display:none;
 }
 #btn{
    padding: 12px 22px ;
    background-color: rgba(27, 123, 96, 0.748);
    color: #fff;
    cursor: pointer;
    border-radius: 10px;
    font-weight: bold;
 }
 #btn:hover{
    background-color: rgb(13, 60, 47);
 }
</style>
<body>
<div id="main">
<input id="fileinp" type="file" >

<div id ="btn">Upload File</div>
</div>
    <script src="script.js"></script>
</body>
</html>
